# Render Blueprint: the Life Agent backend + Claude connector, and its Postgres database.
# Render → New → Blueprint → pick this repo. See DEPLOY.md for the full steps.
#
# Secrets are never in this file: DJANGO_SECRET_KEY is generated by Render, and
# OPENROUTER_API_KEY is typed into the Render dashboard (sync: false).

databases:
  - name: life-agent-db
    databaseName: life_agent
    user: life_agent
    plan: basic-256mb

services:
  - type: web
    name: life-agent
    runtime: python
    plan: starter            # always on; the free plan sleeps and Claude may time out waking it
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate
    startCommand: uvicorn config.asgi:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.6"
      - key: PRODUCTION
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: life-agent-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false          # enter it in the Render dashboard; never commit it
      - key: AGENT_MODEL
        value: anthropic/claude-opus-5.5
      # Synthetic demo data: pin "today" to the synthetic dataset's Monday.
      # Remove once real Apple Watch + calendar data flows in.
      - key: DEMO_TODAY
        value: "2026-11-16"
      - key: USER_TIME_ZONE
        value: America/Chicago
